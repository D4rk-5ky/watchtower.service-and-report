# This config file is for using local sendmail/Postfix as the mail backend.
# MQTT and mail are independent optional channels; a later power action is also optional.
# Default reporting config named directly by systemd/watchtower.service ExecStartPost.
# Installation: /opt/mqtt-power-action/configs/
# Edit broker/mail settings here before starting the service.

# Strict INI: define every section/option only once; duplicate keys are rejected with a line-specific error.

[server]
# Friendly hostname used in MQTT messages, MQTT topic templates, client_id templates, and mail subjects.
# If this is empty or missing, the Python script falls back to the real OS hostname.
hostname = example-host

[power]
# Power action to run after enabled notification processing has completed.
# Valid values: shutdown, reboot, or none.
# none = process any enabled MQTT/mail reporting, but do not shut down or reboot.
action = none

# Seconds to wait after enabled notification processing before shutdown or reboot.
# Ignored when action = none because no power action follows.
delay_before_action = 10

# true = no local power command, no delay, and no notifications by default.
# MQTT and mail can each be opted in below; MQTT preview reports carry dry_run=true.
# false = normal reporting; action=none still never runs a local power command.
dry_run = true

# false = abort before power if enabled MQTT cannot be sent; readiness mail runs first.
# true = continue even if enabled MQTT fails. Ignored when [mqtt] enabled = false.
continue_on_mqtt_fail = false

# false = abort the later power flow if enabled success mail cannot be sent.
# true = continue even if enabled success mail fails. Ignored when [mail] enabled = false.
continue_on_mail_fail = false

[mqtt]
# Master switch for this output channel.
# true = publish MQTT normally. false = skip MQTT completely; broker settings are ignored and paho-mqtt is not required.
# The entire [mqtt] section may also be omitted to disable MQTT.
enabled = true

# MQTT broker/server IP address or DNS name.
host = mqtt.example.invalid

# MQTT broker port. 1883 is the normal unencrypted MQTT port.
port = 1883

# MQTT username. Leave empty if your broker does not require login.
username =

# MQTT password written directly in this file.
# Leaving this empty is safer if you use password_env instead.
password =

# Name of an environment variable containing the MQTT password.
# Example: password_env = MQTT_PASSWORD
password_env =

# MQTT result topic to publish to.
# All Watchtower hosts can publish to the SAME result topic; the JSON payload includes
# a host field so Home Assistant can identify which machine sent the report.
# HomeAssistant/watchtower-manual-update.yaml filters that shared topic by host, then
# reads status from the JSON payload itself.
# shows one generic trigger that handles success/failure/unknown for every host.
# You may choose any topic, but configure the same topic in the matching HA automation.
# ExecStartPost derives success/failure from the already-finished Watchtower job.
topic = homeassistant/watchtower/status

# Example custom JSON message.
# {event} becomes server_shutdown, server_reboot, or success when action = none.
# {hostname} becomes the hostname from [server].
# Double literal JSON braces because custom messages use Python string formatting.
# Custom hostname substitutions are not JSON-escaped; auto handles escaping safely.
# Ordinary custom messages MUST be JSON with status=success/failure. Watchtower requires auto.
#message = {{"status":"success","title":"Maintenance completed","exit_code":0,"warning":false,"event":"{event}","host":"{hostname}","source":"unattended-upgrades"}}

# auto includes Syncerate status/success/title/name/job/exit_code/warning/error/stderr,
# skipped_datasets=[], plus host/event/dry_run/phase and Watchtower diagnostics. Partial example:
# {"status":"success","title":"example-host: none","exit_code":0,"warning":false,
#  "error":"","stderr":"","event":"success","host":"example-host"}
# Status describes the job being reported, NOT future mail or power completion.
message = auto

# auto makes the script generate a client ID like:
# mqtt-power-action-example-host
client_id = auto

# MQTT Quality of Service.
# 0 = at most once, 1 = at least once, 2 = exactly once.
qos = 1

# false = do not retain the MQTT message on the broker.
# true is rejected: completion reports must never be retained.
retain = false

# Overall MQTT subprocess deadline, including DNS/connect/publish; finite positive seconds.
# If omitted, the connect_timeout + publish_timeout sum is used.
timeout = 20

# Send real MQTT during power.dry_run=true. Off by default; use a test topic.
publish_dry_run = false

# Legacy timeout components; used as a summed overall deadline only if timeout is omitted.
connect_timeout = 10
publish_timeout = 10

[report]
# Watchtower mode uses title/comment but derives outcome fields from completed logs.
# job is always watchtower in that mode; ordinary mode uses the job setting below.
# Used for automatic ordinary result JSON. Mail-only mode also uses this report data without requiring MQTT.
# systemd invokes the script after the Watchtower container has finished.
# success or failure selects the branch in the supplied Home Assistant automation.
# This is independent of power.action and of MQTT delivery success.
status = success

# Human-readable title. auto/empty uses hostname: Watchtower in checked mode, else hostname: action.
# Custom titles support {hostname}, {safe_hostname}, {action}, and {event}.
title = auto

# Ordinary report job identity; supports hostname/action/event templates.
# Watchtower mode always reports job=watchtower.
job = mqtt-power-action

# Optional static context included in automatic JSON.
comment =

# Integer job result code, or auto/empty for 0 on success and 1 on failure.
# Status follows this code: zero means success; nonzero means failure.
exit_code = auto

# true marks non-fatal warnings; encoded as a JSON boolean, not a string.
warning = false

# Error summary and captured output supplied by the caller (plain text, no templates).
# JSON escaping is automatic, including quotes, backslashes, and multiline INI text.
error =
stderr =

[mail]
# Opt in to real email during power.dry_run=true; on_success/on_failure still select events.
# Preview email subjects are prefixed [DRY-RUN]. Disabled by default.
send_dry_run = false

# Master switch for script-level email.
# true = allow on_success/on_failure mail. false = skip all mail; backend/recipient/SMTP settings are ignored.
# The entire [mail] section may also be omitted to disable script-level email.
enabled = true

# When mail is enabled, send mail when the applicable pre-power/report flow succeeds.
on_success = true

# When mail is enabled, send mail for an applicable job, MQTT, mail, or power failure.
on_failure = true

# Mail backend to use.
# This config uses local sendmail/Postfix.
backend = sendmail

# Recipient email address.
to = receiver@example.com

# Sender address shown in the email.
from = sender@example.com

# Subject for success mail.
# {hostname} and {action} are replaced by the script.
success_subject = {hostname}: report completed successfully

# Subject for failure mail.
# {hostname} and {action} are replaced by the script.
failure_subject = {hostname}: report or power action failed

# Extra text appended to the email body.
extra_body = Sent from local sendmail/Postfix.

[sendmail]
# Optional full path to sendmail.
# Leave empty to let the script auto-detect /usr/sbin/sendmail, /usr/bin/sendmail, or sendmail in PATH.
path =

# SMTP options are ignored while [mail] backend = sendmail.
# To use SMTP, select backend = smtp and configure your account below.
[smtp]
# SMTP server address.
host = smtp.example.com

# Server port: commonly 587 for STARTTLS, 465 for implicit TLS.
port = 587

# Required when SMTP mail is enabled; also used as sender if [mail] from is empty.
username =

# Direct password takes priority over password_env. Avoid storing a real secret here.
password =

# Name of an environment variable containing the password, e.g. SMTP_PASSWORD.
# Enabled SMTP mail requires a configured password source and a nonempty value.
password_env =

# true = TLS immediately on connect; takes precedence over starttls.
ssl = false

# true = upgrade a normal SMTP connection to TLS before authentication.
# If ssl and starttls are both false, the connection is unencrypted.
starttls = true

# SMTP socket timeout in seconds; use a positive, finite value.
timeout = 20
