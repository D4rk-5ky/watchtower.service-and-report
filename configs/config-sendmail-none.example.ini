# This config file is for using local sendmail/Postfix as the mail backend.
# It sends an MQTT message first, optionally sends mail, then optionally performs a power action.

[server]
# Friendly hostname used in MQTT messages, MQTT topic templates, client_id templates, and mail subjects.
# If this is empty or missing, the Python script falls back to the real OS hostname.
hostname = proxmox

[power]
# Power action to run after MQTT/mail has completed.
# Valid values: shutdown, reboot, or none.
# none = publish MQTT and optionally send mail, but do not shut down or reboot.
action = none

# Seconds to wait after MQTT/mail before running shutdown or reboot.
# Ignored when action = none because no power action follows.
delay_before_action = 10

# true = suppress only the power command; MQTT and mail are still sent.
# For shutdown/reboot, the script still waits for delay_before_action.
# It then prints the power command it would run.
# false = actually run shutdown/reboot.
# This setting has no effect when action = none because no power command is run.
dry_run = true

# false = abort before the later mail/power flow if the MQTT message cannot be sent.
# true = continue even if MQTT fails.
continue_on_mqtt_fail = false

# false = abort the later power flow if the success mail cannot be sent.
# true = continue even if the success mail fails.
continue_on_mail_fail = false

[mqtt]
# MQTT broker/server IP address or DNS name.
host = 10.0.0.10

# MQTT broker port. 1883 is the normal unencrypted MQTT port.
port = 1883

# MQTT username. Leave empty if your broker does not require login.
username =

# MQTT password written directly in this file.
# Leaving this empty is safer if you use password_env instead.
password =

# Name of an environment variable containing the MQTT password.
# Example: password_env = MQTT_PASSWORD
password_env =

# MQTT topic to publish to.
# {safe_hostname} is generated from [server] hostname and made safe for MQTT/client IDs.
# The supplied backup automation subscribes ONLY to these case-sensitive topics:
# homeassistant/Syncerate/Zotac-RI531-RPI5-Storage/status
# homeassistant/Syncerate/Zotac-RI531-AsusN14E/status
# Use one only for that completed backup; success triggers its next backup actions.
# For another job, use its own topic and a matching automation trigger.
topic = homeassistant/{safe_hostname}/power

# Example custom JSON message.
# {event} becomes server_shutdown, server_reboot, or success when action = none.
# {hostname} becomes the hostname from [server].
# Double literal JSON braces because custom messages use Python string formatting.
# Custom hostname substitutions are not JSON-escaped; auto handles escaping safely.
# Custom messages replace [report] values and MUST contain status=success/failure.
#message = {{"status":"success","title":"Maintenance completed","exit_code":0,"warning":false,"event":"{event}","host":"{hostname}","source":"unattended-upgrades"}}

# auto generates a JSON object using [report] plus the original event and host:
# {"status":"success","title":"proxmox: none","exit_code":0,"warning":false,
#  "error":"","stderr":"","event":"success","host":"proxmox"}
# Status describes the job being reported, NOT future mail or power completion.
message = auto

# auto makes the script generate a client ID like:
# mqtt-power-action-proxmox
client_id = auto

# MQTT Quality of Service.
# 0 = at most once, 1 = at least once, 2 = exactly once.
qos = 1

# false = do not retain the MQTT message on the broker.
# true = broker stores the last message on this topic for new subscribers.
retain = false

# Seconds to wait for the connection callback after the synchronous connect call.
# This does not bound the preceding DNS/TCP connection attempt.
connect_timeout = 10

# Seconds to wait for MQTT publish confirmation where the Paho API supports it.
# The older-API compatibility fallback waits without a timeout.
publish_timeout = 10

[report]
# Used only with [mqtt] message = auto (or empty).
# Invoke the script after the job outcome is known. It does not run/monitor backups.
# success or failure selects the branch in the supplied Home Assistant automation.
# This is independent of power.action and of MQTT delivery success.
status = success

# Human-readable job title. auto/empty uses hostname: action.
# Custom titles support {hostname}, {safe_hostname}, {action}, and {event}.
title = auto

# Integer job result code, or auto/empty for 0 on success and 1 on failure.
# This does not change the script's process exit code or its power-action gates.
exit_code = auto

# true marks non-fatal warnings; encoded as a JSON boolean, not a string.
warning = false

# Error summary and captured output supplied by the caller (plain text, no templates).
# JSON escaping is automatic, including quotes, backslashes, and multiline INI text.
error =
stderr =

[mail]
# Send mail when everything before the power action succeeds.
on_success = true

# Send mail if MQTT or the power action fails.
on_failure = true

# Mail backend to use.
# This config uses local sendmail/Postfix.
backend = sendmail

# Recipient email address.
to = receiver@example.com

# Sender address shown in the email.
from = root@proxmox.local

# Subject for success mail.
# {hostname} and {action} are replaced by the script.
success_subject = {hostname}: {action} MQTT sent successfully

# Subject for failure mail.
# {hostname} and {action} are replaced by the script.
failure_subject = {hostname}: {action} MQTT or power action failed

# Extra text appended to the email body.
extra_body = Sent from local sendmail/Postfix.

[sendmail]
# Optional full path to sendmail.
# Leave empty to let the script auto-detect /usr/sbin/sendmail, /usr/bin/sendmail, or sendmail in PATH.
path =

# SMTP options are ignored while [mail] backend = sendmail.
# To use SMTP, select backend = smtp and configure your account below.
[smtp]
# SMTP server address. This is also the script default.
host = smtp.gmail.com

# Server port: commonly 587 for STARTTLS, 465 for implicit TLS.
port = 587

# Required when SMTP mail is enabled; also used as sender if [mail] from is empty.
username =

# Direct password takes priority over password_env. Avoid storing a real secret here.
password =

# Name of an environment variable containing the password, e.g. SMTP_PASSWORD.
# Enabled SMTP mail requires a configured password source and a nonempty value.
password_env =

# true = TLS immediately on connect; takes precedence over starttls.
ssl = false

# true = upgrade a normal SMTP connection to TLS before authentication.
# If ssl and starttls are both false, the connection is unencrypted.
starttls = true

# SMTP socket timeout in seconds; use a positive, finite value.
timeout = 20
