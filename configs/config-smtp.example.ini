# SMTP example for mqtt_power_action_none.py.
# Sends JSON MQTT first, optionally sends mail, then optionally runs a power action.
# Replace example broker/account addresses and password before real use.

[server]
# Friendly name used in payloads, topic/client templates, and email.
# Empty or missing falls back to the OS hostname.
hostname = proxmox

[power]
# shutdown, reboot, or none. none is notification-only and skips the delay.
action = shutdown

# Seconds before shutdown/reboot, including dry-run. Use a finite nonnegative value.
delay_before_action = 10

# Suppresses ONLY the local power command. MQTT/mail are real and the delay remains.
# Receiving MQTT automations can still execute their own actions.
dry_run = true

# false aborts later power processing if MQTT publication fails.
continue_on_mqtt_fail = false

# false aborts later power processing if success-mail delivery fails.
continue_on_mail_fail = false

[mqtt]
# Broker hostname/IP; this script uses plain MQTT, with no MQTT TLS options.
host = 10.0.0.10
port = 1883

# Leave username empty if the broker does not require login.
username =

# A nonempty direct password takes priority over password_env.
password =

# Name of an environment variable containing the MQTT password, e.g. MQTT_PASSWORD.
password_env =

# Topic templates support {hostname}, {safe_hostname}, {action}, and {event}.
# The bundled automation only listens to these case-sensitive backup topics:
# homeassistant/Syncerate/Zotac-RI531-RPI5-Storage/status
# homeassistant/Syncerate/Zotac-RI531-AsusN14E/status
# Use a backup topic only for that completed backup: success triggers follow-up actions.
topic = homeassistant/{safe_hostname}/power

# auto generates valid JSON with [report] plus event and host:
# {"status":"success","title":"proxmox: shutdown","exit_code":0,"warning":false,
#  "error":"","stderr":"","event":"server_shutdown","host":"proxmox"}
# A custom message replaces [report] and must include status=success/failure.
# Double literal JSON braces for templates. Custom substitutions are not JSON-escaped.
#message = {{"status":"success","title":"Maintenance completed","exit_code":0,"warning":false,"event":"{event}","host":"{hostname}","source":"unattended-upgrades"}}
message = auto

# auto generates mqtt-power-action-{safe_hostname}; custom templates are supported.
client_id = auto

# MQTT QoS: 0 at most once, 1 at least once, 2 exactly once at the protocol level.
qos = 1

# false avoids storing the completion event for future subscribers.
retain = false

# Seconds waiting for the callback AFTER the synchronous connect call returns.
# Does not bound the initial DNS/TCP connection. Use a positive finite value.
connect_timeout = 10

# Publish confirmation timeout where supported; the older Paho fallback is unbounded.
publish_timeout = 10

[report]
# Used for automatic/empty mqtt.message only. Supply a known job outcome.
# Independent of delivery success or future mail/power completion.
status = success

# auto/empty uses hostname: action. Custom text supports the four templates above.
title = auto

# Integer job result, or auto/empty: 0 for success, 1 for failure.
# Does not set the script's process exit status or change power-action gates.
exit_code = auto

# Non-fatal job warnings, encoded as a JSON boolean.
warning = false

# Plain error summary and captured output. JSON escaping is automatic.
# No template expansion; indent continuation lines for multiline text.
error =
stderr =

[mail]
# Send success mail after MQTT succeeds, before any power action.
on_success = true

# Attempt failure mail for MQTT, success-mail, or caught power-action failures.
on_failure = true

# sendmail or smtp; this example selects SMTP.
backend = smtp

# Replace with the recipient and sender addresses you use with your SMTP provider.
to = receiver@example.com
from = yourgmail@gmail.com

# Subject templates support {hostname}, {safe_hostname}, {action}, and {event}.
success_subject = {hostname}: {action} MQTT sent successfully
failure_subject = {hostname}: {action} MQTT or power action failed

# Static text appended to mail. Not a template.
extra_body = This message was sent by mqtt_power_action_none.py before power action.

[smtp]
# SMTP server and port; 587 normally uses STARTTLS.
host = smtp.gmail.com
port = 587

# SMTP login username; also used as sender when [mail] from is empty.
username = yourgmail@gmail.com

# Placeholder only. Replace with the account's SMTP/app password before use.
# A direct password takes priority over password_env.
password = your-gmail-app-password

# Alternative: clear password above, set password_env = GMAIL_APP_PASSWORD,
# and populate/export GMAIL_APP_PASSWORD in the environment running the script.
password_env =

# true uses implicit TLS immediately (and takes precedence over starttls).
# For the supplied port 587 setup, keep ssl false and starttls true.
ssl = false

# Upgrade normal SMTP to TLS before login. Both TLS flags false means unencrypted.
starttls = true

# SMTP socket timeout in seconds. Use a positive finite value.
timeout = 20

[sendmail]
# Inactive for SMTP. Explicit executable path if switching backend to sendmail.
# Empty searches /usr/sbin/sendmail, /usr/bin/sendmail, then PATH.
path =
