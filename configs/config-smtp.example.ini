# SMTP example for mqtt_power_action_none.py.
# MQTT and SMTP mail are independent optional channels; a later power action is also optional.
# Replace example broker/account addresses and password before real use.
# Installation: /opt/mqtt-power-action/configs/
# Select this filename in systemd/watchtower.service ExecStartPost to use SMTP reporting.
# Keep action = none for this service: Home Assistant owns shutdown after success.

# Strict INI: define every section/option only once; duplicate keys are rejected with a line-specific error.

[server]
# Friendly name used in payloads, topic/client templates, and email.
# Empty or missing falls back to the OS hostname.
hostname = example-host

[power]
# shutdown, reboot, or none. none is notification-only and skips the delay.
action = none

# Seconds before shutdown/reboot, including dry-run. Use a finite nonnegative value.
delay_before_action = 10

# true = no local power command, no delay, and no notifications by default.
# MQTT and mail can each be opted in below; MQTT preview reports carry dry_run=true.
# false = normal reporting; action=none still never runs a local power command.
dry_run = true

# false aborts later power processing if enabled MQTT publication fails; ignored when MQTT is disabled.
continue_on_mqtt_fail = false

# false aborts later power processing if enabled success-mail delivery fails; ignored when mail is disabled.
continue_on_mail_fail = false

[mqtt]
# Master switch for this output channel.
# true = publish MQTT normally. false = skip MQTT completely; broker settings are ignored and paho-mqtt is not required.
# The entire [mqtt] section may also be omitted to disable MQTT.
enabled = true

# Broker hostname/IP; this script uses plain MQTT, with no MQTT TLS options.
host = mqtt.example.invalid
port = 1883

# Leave username empty if the broker does not require login.
username =

# A nonempty direct password takes priority over password_env.
password =

# Name of an environment variable containing the MQTT password, e.g. MQTT_PASSWORD.
password_env =

# MQTT result topic. All Watchtower hosts may publish to the SAME topic.
# The automatic JSON includes a host field, so Home Assistant can identify the sender.
# The supplied HA examples use one MQTT trigger and inspect payload_json.status.
# Choose any topic you want, but use the same topic in the matching HA automation.
# Topic templates still support {hostname}, {safe_hostname}, {action}, and {event}.
topic = homeassistant/watchtower/status

# auto includes Syncerate status/success/title/name/job/exit_code/warning/error/stderr,
# skipped_datasets=[], plus host/event/dry_run/phase and Watchtower diagnostics. Partial example:
# {"status":"success","title":"example-host: none","exit_code":0,"warning":false,
#  "error":"","stderr":"","event":"success","host":"example-host"}
# A custom message replaces [report] and must include status=success/failure.
# Double literal JSON braces for templates. Custom substitutions are not JSON-escaped.
#message = {{"status":"success","title":"Maintenance completed","exit_code":0,"warning":false,"event":"{event}","host":"{hostname}","source":"unattended-upgrades"}}
message = auto

# auto generates mqtt-power-action-{safe_hostname}; custom templates are supported.
client_id = auto

# MQTT QoS: 0 at most once, 1 at least once, 2 exactly once at the protocol level.
qos = 1

# false avoids storing the completion event for future subscribers.
retain = false

# Overall MQTT subprocess deadline, including DNS/connect/publish; finite positive seconds.
# If omitted, the connect_timeout + publish_timeout sum is used.
timeout = 20

# Send real MQTT during power.dry_run=true. Off by default; use a test topic.
publish_dry_run = false

# Legacy timeout components; used as a summed overall deadline only if timeout is omitted.
connect_timeout = 10
publish_timeout = 10

[report]
# Watchtower mode uses title/comment but derives outcome fields from completed logs.
# job is always watchtower in that mode; ordinary mode uses the job setting below.
# Ordinary mode: supply a known job outcome for automatic reporting.
# --watchtower-compose derives status/exit_code/warning/error/stderr automatically.
# Independent of delivery success or future mail/power completion.
status = success

# auto/empty uses hostname: Watchtower in checked mode, else hostname: action; templates supported.
title = auto

# Ordinary report job identity; supports hostname/action/event templates.
# Watchtower mode always reports job=watchtower.
job = mqtt-power-action

# Optional static context included in automatic JSON.
comment =

# Integer job result, or auto/empty: 0 for success, 1 for failure.
# Status follows this code: zero means success; nonzero means failure.
exit_code = auto

# Non-fatal job warnings, encoded as a JSON boolean.
warning = false

# Plain error summary and captured output. JSON escaping is automatic.
# No template expansion; indent continuation lines for multiline text.
error =
stderr =

[mail]
# Opt in to real email during power.dry_run=true; on_success/on_failure still select events.
# Preview email subjects are prefixed [DRY-RUN]. Disabled by default.
send_dry_run = false

# Master switch for script-level email.
# true = allow on_success/on_failure mail. false = skip all mail; backend/recipient/SMTP settings are ignored.
# The entire [mail] section may also be omitted to disable script-level email.
enabled = true

# Ordinary mode: readiness mail before MQTT/power, or directly in mail-only mode.
# Watchtower mode: success mail for a successful job when any enabled MQTT delivery also succeeded.
on_success = true

# Ordinary mode: failure mail for enabled MQTT, success-mail, or caught power errors.
# Watchtower mode: failure mail for a failed job or failed enabled MQTT delivery.
on_failure = true

# sendmail or smtp; this example selects SMTP.
backend = smtp

# Replace with the recipient and sender addresses you use with your SMTP provider.
to = receiver@example.com
from = sender@example.com

# Subject templates support {hostname}, {safe_hostname}, {action}, and {event}.
success_subject = {hostname}: report completed successfully
failure_subject = {hostname}: report or power action failed

# Static text appended to mail. Not a template.
extra_body = This message was sent by mqtt_power_action_none.py before power action.

[smtp]
# SMTP server and port; 587 normally uses STARTTLS.
host = smtp.example.com
port = 587

# SMTP login username; also used as sender when [mail] from is empty.
username = sender@example.com

# Placeholder only. Replace with the account's SMTP/app password before use.
# A direct password takes priority over password_env.
password = replace-with-password

# Alternative: clear password above, set password_env = SMTP_APP_PASSWORD,
# and populate/export SMTP_APP_PASSWORD in the environment running the script.
password_env =

# true uses implicit TLS immediately (and takes precedence over starttls).
# For the supplied port 587 setup, keep ssl false and starttls true.
ssl = false

# Upgrade normal SMTP to TLS before login. Both TLS flags false means unencrypted.
starttls = true

# SMTP socket timeout in seconds. Use a positive finite value.
timeout = 20

[sendmail]
# Inactive for SMTP. Explicit executable path if switching backend to sendmail.
# Empty searches /usr/sbin/sendmail, /usr/bin/sendmail, then PATH.
path =
