alias: Example host - daily backup at cheapest time
description: >
  Wake the example host if needed, wait until it is online, then start the first backup.
  Process MQTT success and failure reports to continue the backup sequence.
triggers:
  - trigger: time
    at: sensor.daily_backup_cheapest_start
    id: cheapest_start
  - trigger: mqtt
    id: rpi5_backup_status
    options:
      topic: homeassistant/Syncerate/example-job-a/status
  - trigger: mqtt
    id: asus_backup_status
    options:
      topic: homeassistant/Syncerate/example-job-b/status
conditions: []
actions:
  - alias: Scheduled start - wake the example host and start the first backup
    choose:
      - conditions:
          - condition: trigger
            id: cheapest_start
        sequence:
          - alias: Wake and wait only when the example host is not ready
            if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: binary_sensor.example_host_ready
                    state: 'on'
            then:
              - alias: Wake example host
                action: switch.turn_on
                target:
                  entity_id: switch.example_host_power
                data: {}
              - alias: Check readiness every ten seconds for up to ten minutes
                repeat:
                  count: 60
                  sequence:
                    - alias: Wait ten seconds only while the example host is not ready
                      if:
                        - condition: not
                          conditions:
                            - condition: state
                              entity_id: binary_sensor.example_host_ready
                              state: 'on'
                      then:
                        - delay: '00:00:10'
          - alias: Start the first backup if ready; otherwise report a timeout
            if:
              - condition: state
                entity_id: binary_sensor.example_host_ready
                state: 'on'
            then:
              - alias: Start Example source-to-target backup
                action: mqtt.publish
                data:
                  topic: homeassistant/mqtt-listener/example-host
                  payload: start_rpi5_daily
                  qos: 0
                  retain: false
            else:
              - alias: Notify that The example host did not become ready
                action: notify.pushover
                continue_on_error: true
                data:
                  title: ❌ Example backup could not start
                  message: >
                    The example host did not become ready within approximately ten minutes.
                    No backup command was sent.
                  data:
                    priority: 1
                    sound: siren
          - alias: Finish this scheduled invocation; MQTT replies trigger later runs
            stop: Scheduled startup handling finished
  - condition: trigger
    id:
      - rpi5_backup_status
      - asus_backup_status
  - alias: Read the MQTT report
    variables:
      report: |
        {{ trigger.payload_json
           if trigger.payload_json is defined and trigger.payload_json is mapping
           else {} }}
  - variables:
      mqtt_status: |
        {{ report.status | default('unknown') | string | trim | lower }}
      report_title: >
        {{ report.title | default(report.name | default(report.job |
        default('Syncerate'))) }}
  - alias: Handle success or failure
    choose:
      - conditions:
          - condition: template
            value_template: '{{ mqtt_status == ''success'' }}'
        sequence:
          - action: notify.pushover
            continue_on_error: true
            data:
              title: ✅ Syncerate ran successfully
              message: >-
                {{ report_title }} finished successfully.

                Exit code: {{ report.exit_code | default('unknown') }} {% if
                report.warning | default(false) | bool(false) %} Warning:
                Syncerate completed with one or more non-fatal warnings. {%
                endif %}
              data:
                priority: 0
                sound: pushover
          - alias: Continue according to which backup finished
            choose:
              - conditions:
                  - condition: trigger
                    id: rpi5_backup_status
                sequence:
                  - alias: Start Example target-to-source backup
                    action: mqtt.publish
                    data:
                      topic: homeassistant/mqtt-listener/example-host
                      payload: start_asusn14e_daily
                      qos: 0
                      retain: false
              - conditions:
                  - condition: trigger
                    id: asus_backup_status
                sequence:
                  - action: mqtt.publish
                    metadata: {}
                    data:
                      evaluate_payload: false
                      qos: '0'
                      retain: false
                      topic: homeassistant/mqtt-listener/example-host
                      payload: start_cleanupinsyncoidsnapshots
                  - delay:
                      hours: 0
                      minutes: 1
                      seconds: 0
                      milliseconds: 0
                  - action: mqtt.publish
                    metadata: {}
                    data:
                      evaluate_payload: false
                      qos: '0'
                      retain: false
                      topic: homeassistant/mqtt-listener/example-host
                      payload: start_snapbeforewatchtower
                  - delay:
                      hours: 0
                      minutes: 1
                      seconds: 0
                      milliseconds: 0
                  - action: mqtt.publish
                    metadata: {}
                    data:
                      evaluate_payload: false
                      qos: '0'
                      retain: false
                      topic: homeassistant/mqtt-listener/example-host
                      payload: shutdown_delay
                  - action: notify.pushover
                    data:
                      title: Daily example backup complete
                      message: >
                        The final example backup reported success. The backup sequence is complete.
                      data:
                        priority: 0
                        sound: pushover
      - conditions:
          - condition: template
            value_template: '{{ mqtt_status == ''failure'' }}'
        sequence:
          - action: notify.pushover
            data:
              title: ❌ Syncerate sync failed
              message: >-
                {{ report_title }} failed.

                Exit code: {{ report.exit_code | default('unknown') }}

                Error: {{ report.error | default('No error message') }}

                Last stderr/output: {{ report.stderr | default('No stderr
                captured') }}
              data:
                priority: 1
                sound: siren
    default:
      - action: notify.pushover
        data:
          title: ❔ Syncerate status unknown
          message: |-
            Received an MQTT status that was neither success nor failure.
            Title: {{ report_title }}
            Topic: {{ trigger.topic }}
            Raw payload: {{ trigger.payload | default('No payload') }}
          data:
            priority: 0
            sound: pushover
mode: queued
max: 10
